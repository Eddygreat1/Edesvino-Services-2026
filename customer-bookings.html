<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings | Edesvino Services</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    color: #222;
}

header {
    background: #087443;
    color: white;
    text-align: center;
    padding: 22px 12px;
}

header h1 { margin: 0 0 8px; }

nav {
    background: white;
    padding: 14px;
    text-align: center;
}

nav a {
    color: #087443;
    text-decoration: none;
    margin: 7px;
    font-weight: bold;
}

.container {
    max-width: 800px;
    margin: 25px auto;
    padding: 18px;
}

.booking-card {
    background: white;
    padding: 18px;
    margin: 15px 0;
    border-radius: 9px;
    box-shadow: 0 2px 8px #ddd;
}

.booking-card h3 { color: #087443; }

.status {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    background: #fff0c2;
    color: #805900;
    font-size: 13px;
    font-weight: bold;
}

.payment {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    background: #e7eeee;
    color: #333;
    font-size: 13px;
    font-weight: bold;
}

.message {
    background: white;
    padding: 18px;
    border-radius: 8px;
    margin: 15px 0;
}

button {
    background: #087443;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 25px;
    color: #666;
}

.hidden { display: none; }
</style>
</head>

<body>

<header>
    <h1>EDESVINO SERVICES</h1>
    <p>Your account. Your services. Your convenience.</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="browse-services.html">Browse Services</a>
    <a href="booking.html">Book a Service</a>
    <a href="customer-account.html">My Account</a>
</nav>

<div class="container">

    <h2>My Bookings</h2>
    <p>View your service requests and track their progress.</p>

    <div id="message" class="message">
        Checking your account...
    </div>

    <div id="bookings"></div>

    <button id="refreshButton" class="hidden"
    onclick="loadBookings()">Refresh Bookings</button>

</div>

<footer>
    © 2026 Edesvino Services. All rights reserved.
</footer>

<script>
const SUPABASE_URL =
"https://dhsfvctmvgmzrnpgxznd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4ZDqpnq4q6gubdteRQCc5A_JX-OUwlm";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const message = document.getElementById("message");
const bookingsContainer = document.getElementById("bookings");
const refreshButton = document.getElementById("refreshButton");

let currentUser = null;

function showMessage(text) {
    message.textContent = text;
    message.classList.remove("hidden");
}

function hideMessage() {
    message.classList.add("hidden");
}

function formatDate(value) {
    if (!value) return "Not available";

    return new Date(value).toLocaleString("en-NG", {
        dateStyle: "medium",
        timeStyle: "short"
    });
}

function safeText(value) {
    return String(value || "Not available")
        .replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[character]);
}

async function checkCustomer() {

    const { data: { session }, error } =
        await db.auth.getSession();

    if (error || !session) {
        showMessage(
            "Please sign in with your customer account to view your bookings."
        );
        return;
    }

    const user = session.user;

    if (user.user_metadata?.account_type !== "customer") {

        await db.auth.signOut();

        showMessage(
            "Customer access only. Please sign in with your customer account."
        );

        return;
    }

    currentUser = user;

    refreshButton.classList.remove("hidden");

    await loadBookings();
}

async function loadBookings() {

    if (!currentUser) return;

    bookingsContainer.innerHTML = "";
    showMessage("Loading your bookings...");

    const { data: bookings, error } = await db
        .from("service_bookings")
        .select("*")
        .eq("customer_id", currentUser.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);

        showMessage(
            "Unable to load bookings. Please try again."
        );

        return;
    }

    if (!bookings || bookings.length === 0) {

        showMessage(
            "You have not submitted any service bookings yet."
        );

        return;
    }

    const serviceIds = [...new Set(
        bookings.map(item => item.service_id)
    )];

    const providerIds = [...new Set(
        bookings.map(item => item.provider_id)
    )];

    const [serviceResult, providerResult] = await Promise.all([

        db.from("services")
            .select("id,title,price,location")
            .in("id", serviceIds),

        db.from("service_providers")
            .select("id,business_name")
            .in("id", providerIds)

    ]);

    if (serviceResult.error || providerResult.error) {
        console.error(
            serviceResult.error,
            providerResult.error
        );

        showMessage(
            "Your bookings were found, but some service details could not be loaded."
        );
    } else {
        hideMessage();
    }

    const serviceMap = {};
    const providerMap = {};

    (serviceResult.data || []).forEach(item => {
        serviceMap[item.id] = item;
    });

    (providerResult.data || []).forEach(item => {
        providerMap[item.id] = item;
    });

    bookings.forEach(booking => {

        const service = serviceMap[booking.service_id];
        const provider = providerMap[booking.provider_id];

        const card = document.createElement("div");
        card.className = "booking-card";

        card.innerHTML = `
            <h3>${safeText(
                service ? service.title : "Service Booking"
            )}</h3>

            <p><strong>Provider:</strong>
            ${safeText(
                provider ? provider.business_name : "Provider"
            )}</p>

            <p><strong>Price:</strong>
            ${service
                ? "₦" + Number(service.price).toLocaleString("en-NG")
                : "Not available"}
            </p>

            <p><strong>Booking Date:</strong>
            ${formatDate(booking.booking_date)}</p>

            <p><strong>Service Address:</strong>
            ${safeText(booking.service_address)}</p>

            <p><strong>Phone:</strong>
            ${safeText(booking.customer_phone)}</p>

            <p><strong>Booking Status:</strong><br>
            <span class="status">
            ${safeText(booking.booking_status)}
            </span></p>

            <p><strong>Payment Status:</strong><br>
            <span class="payment">
            ${safeText(booking.payment_status)}
            </span></p>

            <p><small>Submitted:
            ${formatDate(booking.created_at)}</small></p>
        `;

        bookingsContainer.appendChild(card);
    });
}

checkCustomer();
</script>

</body>
</html>
